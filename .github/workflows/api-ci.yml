name: API CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/api-ci.yml'

jobs:
  build:
    name: Checkstyle + Compile + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run verify
        working-directory: services/api
        run: ./mvnw verify
