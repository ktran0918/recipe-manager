spring:
  application:
    name: recipe-manager-api

  datasource:
    # ${VAR:default} = read env var, fall back to default if unset (like ?? in C#)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recipe_manager}
    username: ${SPRING_DATASOURCE_USERNAME:recipe_manager}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # validate = Hibernate checks schema matches entities but never modifies it.
      # Flyway owns all schema changes — Hibernate should never touch DDL.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379/0}

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-configured}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8000/api/v1/auth/google/callback}
            scope: openid, email, profile

  # All JSON in/out uses snake_case (docs/api.md is the source of truth) — Java fields
  # stay camelCase; Jackson converts both directions at the (de)serialization boundary.
  # C# equivalent: JsonNamingPolicy.SnakeCaseLower on JsonSerializerOptions.
  jackson:
    property-naming-strategy: SNAKE_CASE

# Custom JWT properties — injected via @ConfigurationProperties (equivalent to IOptions<T>)
jwt:
  # Must be valid Base64 — JwtService decodes it via Decoders.BASE64.decode() before signing.
  # The old default here ("dev-secret-must-be...") contained hyphens, which aren't valid
  # Base64 characters, so it threw IllegalArgumentException the first time any JWT was
  # issued or validated. This default is just a Base64-encoded placeholder phrase (not real
  # key material) long enough to clear the 256-bit minimum — always set JWT_SECRET in .env.
  secret: ${JWT_SECRET:Tk9ULUEtUkVBTC1TRUNSRVQtU0VULUpXVC1TRUNSRVQtSU4tWU9VUi1FTlYtRklMRS0wMA==}
  access-expiry-minutes: ${JWT_ACCESS_EXPIRY_MINUTES:15}
  refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8000}
  servlet:
    context-path: /api/v1
